name: Contact form regression
on:
  push:
    branches: [fix/master-contact-agreement-form]
permissions:
  contents: read
jobs:
  contact:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Contact route regression
        id: route
        continue-on-error: true
        run: node --test tests/master-contact-route.test.cjs
      - run: npx playwright install chromium
      - name: Contact UI regression
        id: ui
        continue-on-error: true
        run: npx playwright test tests/master-contact-form-recovery.spec.js --workers=2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: contact-form-evidence
          path: test-results/
      - name: Require passing regressions
        if: steps.route.outcome != 'success' || steps.ui.outcome != 'success'
        run: exit 1
