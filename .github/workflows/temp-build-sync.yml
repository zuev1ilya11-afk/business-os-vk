name: Temporary branch build sync

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  sync-build:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'fix/company-share-no-management-payroll'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Regenerate committed PWA build artifacts
        run: npm run build
      - name: Commit generated artifacts
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Build artifacts are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add startup-shell.bundle.js startup-eager.bundle.js build-version.js index.html sw.js
          git commit -m "Regenerate build artifacts"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
