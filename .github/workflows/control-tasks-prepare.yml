name: Control tasks v2 branch verification
on:
  push:
    branches: [feat/order-control-tasks-v2]
permissions:
  contents: write
concurrency:
  group: control-tasks-v2-preparation
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_PASSWORD: disposable-test-password
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/order-control-tasks-v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Generate and commit all canonical frontend artifacts
        run: |
          node scripts/prepare-control-v2.cjs
          npm run build
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add supabase/migrations build-version.js index.html sw.js startup-eager.bundle.js startup-shell.bundle.js
          git diff --cached --quiet || git commit -m 'build: finalize isolated task reads and canonical startup bundle'
          git push origin HEAD:feat/order-control-tasks-v2
          npm run build:check
          git archive --format=tar HEAD > control-tasks-source.tar
      - run: npm ci
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.7
      - name: Frozen sender type check
        working-directory: supabase/functions/push-api
        run: deno check index.ts
      - name: PostgreSQL contract and existing sender regression
        env:
          BOS_TEST_POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: bash scripts/test-control-tasks.sh
      - name: Complete server regression
        run: npm run test:server
      - run: npx playwright install chromium
      - name: Browser task and existing order-control checks
        run: npx playwright test tests/control-tasks-v2.spec.js tests/order-control.spec.js tests/order-control-refresh.spec.js --workers=2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: control-tasks-verification
          path: |
            control-tasks-source.tar
            test-results/
          retention-days: 3
