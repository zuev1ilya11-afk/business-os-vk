name: Netlify export temp

on:
  push:
    branches:
      - netlify-export-temp

jobs:
  export:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Prepare clean deployment snapshot
        run: |
          mkdir -p "$RUNNER_TEMP/business-os-netlify"
          rsync -a --delete \
            --exclude='.git/' \
            --exclude='.netlify/' \
            --exclude='.github/workflows/netlify-export-temp.yml' \
            ./ "$RUNNER_TEMP/business-os-netlify/"
      - name: Upload clean repository snapshot
        uses: actions/upload-artifact@v4
        with:
          name: business-os-netlify-clean
          path: ${{ runner.temp }}/business-os-netlify
          include-hidden-files: true
          retention-days: 1
