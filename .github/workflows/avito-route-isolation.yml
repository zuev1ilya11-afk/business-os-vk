name: Avito isolated browser QA
on:
  push:
    branches: [feat/avito-mobile-layout]
    paths: ['.github/workflows/avito-route-isolation.yml']
permissions:
  contents: write
jobs:
  browsers:
    if: github.ref == 'refs/heads/feat/avito-mobile-layout'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Keep synthetic API traffic inside Playwright routing
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          node - <<'JS'
          const fs=require('node:fs'),crypto=require('node:crypto');
          if(crypto.createHash('sha256').update(fs.readFileSync('avito-messages-v25.js')).digest('hex')!=='c5e204ec2a0bc4ad2c4f75ad0e8962009a0b9814655df1edda56dacd853b3353')throw Error('Runtime changed; inspect before continuing');
          for(const path of ['tests/avito-mobile-layout.spec.js','tests/avito-workspace.spec.js','tests/avito-images.spec.js']){
            const source=fs.readFileSync(path,'utf8');
            if(source.includes("serviceWorkers:'block'"))continue;
            const anchor="const {test,expect}=require('@playwright/test');";
            if(source.split(anchor).length!==2)throw Error('Unexpected test setup: '+path);
            fs.writeFileSync(path,source.replace(anchor,anchor+"\n// page.route cannot intercept service-worker traffic. These cases use only synthetic APIs; PWA tests stay separate.\ntest.use({serviceWorkers:'block'});"));
          }
          JS
          npm run build:check
          git diff --check
          test "$(git ls-remote origin refs/heads/feat/avito-mobile-layout | cut -f1)" = "$EXPECTED_SHA"
          git add tests/avito-mobile-layout.spec.js tests/avito-workspace.spec.js tests/avito-images.spec.js
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'test: keep mocked Avito requests in browser routing rather than live service workers'
            git push origin HEAD:refs/heads/feat/avito-mobile-layout
          fi
          git rev-parse HEAD > tested-sha.txt
      - run: npm ci
      - run: npx playwright install --with-deps webkit chromium
      - name: Chromium full Avito regression
        env:
          BOS_AVITO_CAPTURE: '1'
        run: npx playwright test tests/avito*.spec.js --workers=2 --retries=0 --trace=retain-on-failure --reporter=json > avito-chromium-results.json
      - name: WebKit layout, navigation, drafts and images
        if: success() || failure()
        env:
          BOS_AVITO_CAPTURE: '1'
        run: |
          node - <<'JS'
          require('node:fs').writeFileSync('avito-webkit.config.cjs',"const base=require('./playwright.config.js');module.exports={...base,retries:0,use:{...base.use,browserName:'webkit'},outputDir:'test-results-webkit'};");
          JS
          npx playwright test -c avito-webkit.config.cjs tests/avito-mobile-layout.spec.js tests/avito-workspace.spec.js tests/avito-images.spec.js --workers=2 --trace=retain-on-failure --reporter=json > avito-webkit-results.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: avito-isolated-browser-qa
          path: |
            tested-sha.txt
            avito-chromium-results.json
            avito-webkit-results.json
            test-results/
            test-results-webkit/
          retention-days: 3
