name: Temporary build for pending agreement fix

on:
  push:
    branches: [fix/master-agreement-pending-contact]

permissions:
  contents: write

jobs:
  build-and-target-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/master-agreement-pending-contact
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build generated PWA assets
        run: npm run build
      - name: Install Chromium
        run: npx playwright install chromium
      - name: Run contact/agreement regression
        run: npx playwright test tests/master-contact-form-recovery.spec.js --workers=1
      - name: Commit generated assets
        shell: bash
        run: |
          git add build-version.js index.html startup-shell.bundle.js startup-eager.bundle.js sw.js
          if git diff --cached --quiet; then
            echo "Generated assets are current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Build pending agreement fix"
          git push
