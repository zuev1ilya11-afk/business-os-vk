name: Recovery application
on:
  pull_request:
    paths:
      - 'deploy/recovery/**'
      - '.github/workflows/recovery-app.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: Application tests and reproducible package
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run application unit tests
        run: python3 -m unittest discover -s deploy/recovery -p 'test_app*.py' -v
      - name: Check deterministic package and embedded modules
        run: |
          python3 - <<'PY'
          import hashlib
          from pathlib import Path
          import subprocess
          import sys
          import zipfile
          sys.path.insert(0, 'deploy/recovery')
          import build_app
          package = Path('deploy/recovery/bos-app.pyz')
          launcher = Path('deploy/recovery/app.ps1')
          original_package = package.read_bytes()
          original_launcher = launcher.read_bytes()
          first = build_app.build()
          second = build_app.build()
          assert first == second == hashlib.sha256(original_package).hexdigest()
          assert package.read_bytes() == original_package
          assert launcher.read_bytes() == original_launcher
          with zipfile.ZipFile(package) as archive:
              assert archive.testzip() is None
              assert set(archive.namelist()) == set(build_app.MODULES) | {'__main__.py'}
              for name in build_app.MODULES:
                  assert archive.read(name) == (build_app.ROOT / name).read_bytes()
          subprocess.run([sys.executable, str(package), '--help'], check=True)
          print('Application package is reproducible and contains every runtime module')
          PY
  browser:
    name: Local browser startup and network restrictions
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned Playwright and its Chromium
        run: |
          npm install --prefix "$RUNNER_TEMP/bos-browser" --no-save --package-lock=false playwright@1.65.1
          "$RUNNER_TEMP/bos-browser/node_modules/.bin/playwright" install --with-deps chromium
          echo "NODE_PATH=$RUNNER_TEMP/bos-browser/node_modules" >> "$GITHUB_ENV"
      - name: Exercise real frontend modules against a synthetic local API
        env:
          BOS_APP_BROWSER_CONTRACT: '1'
        working-directory: deploy/recovery
        run: python3 -m unittest test_app_browser.BrowserContractTests -v
  windows-launcher:
    name: Offline app launcher on Windows
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned public CPython for synthetic launcher test
        shell: powershell
        run: |
          $target = Join-Path $env:RUNNER_TEMP 'python-3.12.10-embed-amd64.zip'
          Invoke-WebRequest -UseBasicParsing -Uri 'https://www.python.org/ftp/python/3.12.10/python-3.12.10-embed-amd64.zip' -OutFile $target
          "BOS_APP_PYTHON_ZIP=$target" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Run offline launcher processes
        shell: powershell
        run: deploy/recovery/test_app_launcher.ps1
  real-application:
    name: Offline application with real Supabase services
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Start a disposable local Docker daemon
        id: engine
        uses: docker/setup-docker-action@3f1ab1ab0e29231562e4db4ca600c1a49653bac6 # v5.7.0
        with:
          version: v28.5.2
          daemon-config: |
            {"features":{"containerd-snapshotter":false}}
      - name: Pull versioned public fixture images
        env:
          FIXTURE_DOCKER_HOST: ${{ steps.engine.outputs.sock }}
        run: |
          python3 - <<'PY'
          import os
          import subprocess
          import sys
          sys.path.insert(0, 'deploy/recovery')
          from test_app_integration import PUBLIC_IMAGES
          for reference in PUBLIC_IMAGES.values():
              subprocess.run(['docker', '--host', os.environ['FIXTURE_DOCKER_HOST'],
                              'image', 'pull', '--quiet', reference], check=True, timeout=300)
          PY
      - name: Capture, restore and launch the real synthetic application
        env:
          BOS_RECOVERY_APP_TEST: '1'
          BOS_RECOVERY_DOCKER_SOCKET: ${{ steps.engine.outputs.sock }}
          BOS_RECOVERY_DOCKER_VERSION: v28.5.2
        run: python3 deploy/recovery/test_app_integration.py --require
