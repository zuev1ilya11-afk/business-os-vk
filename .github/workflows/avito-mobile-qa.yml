name: Avito mobile layout QA
on:
  push:
    branches: [feat/avito-mobile-layout]
    paths: ['scripts/avito-mobile-edits.json', 'tests/avito*.spec.js', 'avito-messages-v25.js', '.github/workflows/avito-mobile-qa.yml']
permissions:
  contents: write
concurrency:
  group: avito-mobile-layout-qa
  cancel-in-progress: false
jobs:
  verify:
    if: github.ref == 'refs/heads/feat/avito-mobile-layout'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Canonical build and guarded branch-only artifact update
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          node --check avito-messages-v25.js
          npm run build
          npm run build:check
          git diff --check
          test "$(git ls-remote origin refs/heads/feat/avito-mobile-layout | cut -f1)" = "$EXPECTED_SHA"
          git add build-version.js index.html sw.js startup-shell.bundle.js startup-eager.bundle.js
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'build: regenerate canonical Avito mobile assets'
            git push origin HEAD:refs/heads/feat/avito-mobile-layout
          fi
          git rev-parse HEAD > tested-sha.txt
          git archive --format=tar HEAD > "$RUNNER_TEMP/avito-source.tar"
      - uses: actions/upload-artifact@v4
        with:
          name: avito-mobile-source
          path: ${{ runner.temp }}/avito-source.tar
          retention-days: 1
      - run: npm ci
      - run: npm run test:server
      - run: npx playwright install chromium
      - name: Chromium Avito layout and all existing Avito UI flows
        env:
          BOS_AVITO_CAPTURE: '1'
        run: npx playwright test tests/avito*.spec.js --workers=2 --retries=0 --reporter=json > avito-chromium-results.json
      - name: Install WebKit test runtime
        run: npx playwright install --with-deps webkit
      - name: WebKit responsive Avito and adjacent workspace flows
        env:
          BOS_AVITO_CAPTURE: '1'
        run: |
          node - <<'JS'
          const fs=require('node:fs');fs.writeFileSync('avito-webkit.config.cjs',"const base=require('./playwright.config.js');module.exports={...base,retries:0,use:{...base.use,browserName:'webkit'},outputDir:'test-results-webkit'};");
          JS
          npx playwright test -c avito-webkit.config.cjs tests/avito-mobile-layout.spec.js tests/avito-workspace.spec.js tests/avito-images.spec.js --workers=2 --reporter=json > avito-webkit-results.json
      - name: Summarize exact browser results
        if: always()
        run: |
          node - <<'JS'
          const fs=require('node:fs');
          for(const name of ['avito-chromium-results.json','avito-webkit-results.json']){
            if(!fs.existsSync(name))continue;
            const r=JSON.parse(fs.readFileSync(name,'utf8')),failures=[];
            function visit(suites){for(const suite of suites||[]){for(const spec of suite.specs||[])if(!spec.ok)failures.push({file:spec.file,line:spec.line,title:spec.title,tests:spec.tests});visit(suite.suites)}}
            visit(r.suites);console.log(JSON.stringify({name,stats:r.stats,failures,errors:r.errors},null,2));
          }
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: avito-mobile-layout-qa
          path: |
            tested-sha.txt
            avito-chromium-results.json
            avito-webkit-results.json
            test-results/
            test-results-webkit/
          retention-days: 3
