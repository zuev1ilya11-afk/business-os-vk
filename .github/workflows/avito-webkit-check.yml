name: Avito browser parity
on:
  push:
    branches: [feat/avito-mobile-layout]
    paths: ['scripts/avito-fixture-cors.json', '.github/workflows/avito-webkit-check.yml']
permissions:
  contents: write
jobs:
  browsers:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Make synthetic HTTP fixtures match existing API CORS responses
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          node - <<'JS'
          const fs=require('node:fs'),crypto=require('node:crypto');const hash=s=>crypto.createHash('sha256').update(s).digest('hex');
          for(const p of JSON.parse(fs.readFileSync('scripts/avito-fixture-cors.json','utf8'))){
            const source=fs.readFileSync(p.path,'utf8');if(hash(source)===p.after)continue;
            if(hash(source)!==p.before)throw Error('Fixture changed: '+p.path);
            const lines=source.match(/[^\n]*\n|[^\n]+$/g)||[];
            for(const [a,b,text] of [...p.edits].reverse())lines.splice(a,b-a,text);
            const result=lines.join('');if(hash(result)!==p.after)throw Error('Fixture patch mismatch: '+p.path);
            fs.writeFileSync(p.path,result);
          }
          if(hash(fs.readFileSync('avito-messages-v25.js'))!=='c5e204ec2a0bc4ad2c4f75ad0e8962009a0b9814655df1edda56dacd853b3353')throw Error('Runtime changed');
          JS
          npm run build:check
          git diff --check
          test "$(git ls-remote origin refs/heads/feat/avito-mobile-layout | cut -f1)" = "$EXPECTED_SHA"
          git add tests
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'test: model real API CORS and preflight in cross-browser fixtures'
            git push origin HEAD:refs/heads/feat/avito-mobile-layout
          fi
          git rev-parse HEAD > tested-sha.txt
      - run: npm ci
      - run: npx playwright install --with-deps webkit chromium
      - name: Chromium Avito regression without retries
        env:
          BOS_AVITO_CAPTURE: '1'
        run: npx playwright test tests/avito*.spec.js --workers=2 --retries=0 --trace=retain-on-failure --reporter=json > avito-chromium-results.json
      - name: WebKit Avito regression without retries
        if: success() || failure()
        env:
          BOS_AVITO_CAPTURE: '1'
        run: |
          node - <<'JS'
          const fs=require('node:fs');fs.writeFileSync('avito-webkit.config.cjs',"const base=require('./playwright.config.js');module.exports={...base,retries:0,use:{...base.use,browserName:'webkit'},outputDir:'test-results-webkit'};");
          JS
          npx playwright test -c avito-webkit.config.cjs tests/avito-mobile-layout.spec.js tests/avito-workspace.spec.js tests/avito-images.spec.js --workers=2 --trace=retain-on-failure --reporter=json > avito-webkit-results.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: avito-browser-parity
          path: |
            tested-sha.txt
            avito-chromium-results.json
            avito-webkit-results.json
            test-results/
            test-results-webkit/
          retention-days: 3
