name: Smart assignment layout verification
on:
  push:
    branches: [fix/smart-assignment-layout]
permissions:
  contents: write
concurrency:
  group: smart-assignment-layout-branch
  cancel-in-progress: false
jobs:
  verify:
    if: github.ref == 'refs/heads/fix/smart-assignment-layout'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Keep the existing business logic and repair dispatcher grid specificity
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          node - <<'JS'
          const fs=require('node:fs'),crypto=require('node:crypto');
          const path='dispatcher-smart-dispatch-v121.js',source=fs.readFileSync(path,'utf8');
          const hash=s=>crypto.createHash('sha256').update(s).digest('hex');
          if(hash(source.split('const style=document.createElement')[0])!=='19019b17b8eecff17c04fcec6ba48c13718079c6e21caf629c4343838fbde1af')throw Error('Business logic changed; stop');
          const css=fs.readFileSync('scripts/smart-assign-layout.css.txt','utf8');
          const next=source.replace(/style.textContent=`[\s\S]*?`;/,'style.textContent=`'+css+'`;');
          if(hash(next)!=='85ad5bb06baf6c5dc4125ffa3e9ece2f186ac27b9bd3fb01badd9fc8cd45e8fc')throw Error('CSS-only patch mismatch');
          fs.writeFileSync(path,next);
          const test='tests/dispatcher-smart-layout.spec.js';let fixture=fs.readFileSync(test,'utf8');
          function replace(before,after){if(fixture.includes(after))return;if(fixture.split(before).length!==2)throw Error('Fixture anchor changed');fixture=fixture.replace(before,after);}
          replace("master.full_name='Александр Константинопольский';","db.tables.business_staff.find(s=>s.id===master.id).full_name='Александр Константинопольский';");
          replace("const best=smart.locator('.dsd121Candidate').first(),time=await best.getAttribute('data-time');","const best=smart.locator('.dsd121Candidate').first(),time=await best.getAttribute('data-time');\n  const bestKey=await best.getAttribute('data-master'),chosen=db.tables.business_staff.find(s=>s.external_id===bestKey);\n  expect(chosen).toBeTruthy();");
          replace('.master_staff_id).toBe(master.id);','.master_staff_id).toBe(chosen.id);');
          fs.writeFileSync(test,fixture);
          JS
          node --check dispatcher-smart-dispatch-v121.js
          node --check tests/dispatcher-smart-layout.spec.js
          npm run build
          npm run build:check
          git diff --check
          test "$(git ls-remote origin refs/heads/fix/smart-assignment-layout | cut -f1)" = "$EXPECTED_SHA"
          git add dispatcher-smart-dispatch-v121.js build-version.js index.html sw.js tests/dispatcher-smart-layout.spec.js
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'fix: align desktop dispatcher rows and exercise stored long-name fixtures'
            git push origin HEAD:refs/heads/fix/smart-assignment-layout
          fi
          git rev-parse HEAD > tested-sha.txt
      - run: npm ci
      - run: npx playwright install chromium
      - name: Smart layout, one-click assignment and neighboring picker flows
        run: npx playwright test tests/dispatcher-smart-layout.spec.js tests/dispatcher-smart-dispatch-v121.spec.js tests/dispatcher-smart-assign-v119.spec.js --workers=2 --reporter=json > smart-layout-results.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smart-assignment-layout-qa
          path: |
            tested-sha.txt
            smart-layout-results.json
            test-results/
          retention-days: 3
