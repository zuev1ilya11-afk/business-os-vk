name: Push candidate workspace
on:
  push:
    branches: [feat/web-push-v211]
permissions:
  contents: write
jobs:
  workspace:
    if: github.ref == 'refs/heads/feat/web-push-v211'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.7
      - name: Narrow optional device without changing authorization
        run: |
          node - <<'JS'
          const fs=require('node:fs'),p='supabase/functions/push-api/index.ts';
          let s=fs.readFileSync(p,'utf8');
          s=s.replace('device:connected?{id:device.id','device:connected&&device?{id:device.id');
          if(!s.includes('device:connected&&device?{id:device.id'))throw Error('Unexpected device serialization');
          fs.writeFileSync(p,s);
          JS
          npm ci
          npm run test:server
      - name: Resolve and verify sender dependencies
        working-directory: supabase/functions/push-api
        run: |
          deno --version
          deno check index.ts
          deno test --allow-env --allow-read webpush-runtime.test.ts
          test -s deno.lock
          node - <<'JS'
          const fs=require('node:fs');
          const p='deno.json',c=JSON.parse(fs.readFileSync(p));
          c.lock={path:'./deno.lock',frozen:true};
          fs.writeFileSync(p,JSON.stringify(c)+'\n');
          JS
          deno check index.ts
          deno test --allow-env --allow-read webpush-runtime.test.ts
      - name: Persist verified sender and lockfile only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add supabase/functions/push-api/index.ts supabase/functions/push-api/deno.json supabase/functions/push-api/deno.lock
          if ! git diff --cached --quiet; then
            git commit -m 'fix(push): verify optional device and freeze sender dependencies'
            git push origin HEAD:refs/heads/feat/web-push-v211
          fi
      - name: Export exact candidate
        if: always()
        run: git archive --format=tar HEAD > /tmp/push-checked-source.tar
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: push-checked-source
          path: /tmp/push-checked-source.tar
          retention-days: 1
