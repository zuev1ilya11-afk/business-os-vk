name: Refresh hotfix build assets

on:
  push:
    branches:
      - fix/master-report-finalize-timeout

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/master-report-finalize-timeout
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Commit generated assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add startup-shell.bundle.js startup-eager.bundle.js index.html sw.js build-version.js
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "build: refresh generated assets"
          git push origin HEAD:fix/master-report-finalize-timeout
