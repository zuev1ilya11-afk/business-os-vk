name: Temp master report reminder v198
on:
  push:
    branches: [feat/master-report-reminder-v198]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/master-report-reminder-v198
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Apply focused master dashboard change
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          const sourcePath='master-daily-home-v127.js';
          let s=fs.readFileSync(sourcePath,'utf8');
          const must=(re,repl,label)=>{
            if(!re.test(s))throw new Error('Patch target missing: '+label);
            s=s.replace(re,repl);
          };

          must(/function scheduleTs\(o\)\{[\s\S]*?\n\}/,`function scheduleTs(o){
            const d=dateOf(o),t=timeOf(o)||'23:59';
            if(!d)return Number.POSITIVE_INFINITY;
            const ts=new Date(\`${'${d}'}T${'${t}'}:00\`).getTime();
            return Number.isFinite(ts)?ts:Number.POSITIVE_INFINITY;
          }
          const minutesOf=v=>{const m=String(v||'').match(/(\\d{1,2}):(\\d{2})/);if(!m)return NaN;const h=Number(m[1]),n=Number(m[2]);return h>=0&&h<24&&n>=0&&n<60?h*60+n:NaN};
          function scheduleEndTs(o){
            const start=scheduleTs(o);if(!Number.isFinite(start))return Number.POSITIVE_INFINITY;
            const startMin=minutesOf(timeOf(o));if(!Number.isFinite(startMin))return start+60*60000;
            const pair=String(o?.time_slot||'').match(/(\\d{1,2}:\\d{2})\\s*[–—-]\\s*(\\d{1,2}:\\d{2})/);
            let endMin=pair?minutesOf(pair[2]):NaN;
            if(!Number.isFinite(endMin)||endMin<=startMin)endMin=startMin+60;
            return start+(endMin-startMin)*60000;
          }
          const reportOverdue=(o,now=Date.now())=>active(o)&&!reportUploaded(o)&&Number.isFinite(scheduleEndTs(o))&&now>=scheduleEndTs(o)+90*60000;
          const currentPending=(o,now)=>active(o)&&!reportUploaded(o)&&Number.isFinite(scheduleTs(o))&&scheduleTs(o)<=now;`,`schedule/end helpers`);

          must(/function attentionReason\(o,now\)\{[\s\S]*?\n\}/,`function attentionReason(o,now){
            if(!active(o))return'';
            if(reportRejected(o))return'Отчёт вернули на доработку';
            if(reportOverdue(o,now))return'Отчёт не отправлен вовремя';
            if(calledDone(o)&&!agreementDone(o))return'Нужно согласовать дату и время';
            if(!calledDone(o)&&!dateOf(o))return'Нужно связаться с клиентом';
            const ts=scheduleTs(o);
            if(Number.isFinite(ts)&&ts<now-30*60000&&!workDone(o)&&!reportUploaded(o))return'Время заявки уже наступило';
            return'';
          }`,`attention reason`);

          must(/function nextOrder\(orders,now\)\{[\s\S]*?\n\}/,`function nextOrder(orders,now){
            const pending=orders.filter(active).filter(o=>!reportUploaded(o));
            const current=pending.filter(o=>currentPending(o,now)).sort((a,b)=>scheduleTs(a)-scheduleTs(b))[0];
            if(current)return current;
            const scheduled=pending.filter(o=>Number.isFinite(scheduleTs(o))).sort((a,b)=>scheduleTs(a)-scheduleTs(b));
            return scheduled.find(o=>scheduleTs(o)>=now)||pending.find(o=>!Number.isFinite(scheduleTs(o)))||null;
          }`,`next order`);

          must(/function dayOrders\(orders,next\)\{[\s\S]*?\n\}/,`function dayOrders(orders,next){
            const day=dateOf(next);
            if(!next||!day)return[];
            return orders.filter(o=>o!==next&&active(o)&&dateOf(o)===day&&(!reportUploaded(o)||reportRejected(o))).sort((a,b)=>scheduleTs(a)-scheduleTs(b));
          }`,`day orders`);

          must(/function nextHtml\(o\)\{[\s\S]*?\n\}/,`function nextHtml(o,now){
            if(!o)return \`<div class="masterV127Empty"><b>Ближайших активных заявок нет</b><span>Новые назначения появятся здесь автоматически.</span></div>\`;
            const time=timeOf(o)||'—',address=String(o.address||o.client_address||'Адрес не указан'),current=currentPending(o,now),overdue=reportOverdue(o,now);
            return \`<button type="button" class="masterV127Next${'${overdue?\' reportOverdue\':\'\'}'}" data-order-id="${'${escv(o.id)}'}" onclick="openOrder('${'${escv(o.id)}'}')"><div class="masterV127When"><b>${'${escv(time)}'}</b><span>${'${escv(dateLabel(o))}'}</span></div><div class="masterV127Main"><small>${'${current?\'ТЕКУЩАЯ ЗАЯВКА\':\'БЛИЖАЙШАЯ ЗАЯВКА\'}'}</small><h3>№ ${'${escv(orderNo(o))}'}</h3><p>${'${escv(address)}'}</p>${'${overdue?\'<span class="masterV127ReportReminder">Отправьте отчёт по заявке</span>\':\'\'}'}<strong>${'${escv(step(o))}'}</strong></div><span class="masterV127Arrow">›</span></button>\`;
          }`,`next html`);

          const oldRender="const orders=mine(),now=Date.now(),next=nextOrder(orders,now),otherDay=dayOrders(orders,next),attention=orders.map(o=>({o,reason:attentionReason(o,now)})).filter(x=>x.reason).sort((a,b)=>scheduleTs(a.o)-scheduleTs(b.o));";
          const newRender=oldRender;
          if(!s.includes(oldRender))throw new Error('Patch target missing: render data');
          s=s.replace(oldRender,newRender);
          const oldSig="const sig=JSON.stringify([orders.map(o=>[o.id,o.status,o.scheduled_date,o.scheduled_time,o.time_slot,o.address,o.client,o.master_called_at,o.master_agreed_at,o.master_workflow_stage,o.report_uploaded_at,o.report_act_url,o.report_review_status,o.report_review_comment]),otherDay.map(o=>o.id),attention.map(x=>[x.o.id,x.reason])]);";
          const newSig="const sig=JSON.stringify([orders.map(o=>[o.id,o.status,o.scheduled_date,o.scheduled_time,o.time_slot,o.address,o.client,o.master_called_at,o.master_agreed_at,o.master_workflow_stage,o.report_uploaded_at,o.report_act_url,o.report_review_status,o.report_review_comment]),next?.id||'',!!next&&currentPending(next,now),!!next&&reportOverdue(next,now),otherDay.map(o=>o.id),attention.map(x=>[x.o.id,x.reason])]);";
          if(!s.includes(oldSig))throw new Error('Patch target missing: render sig');
          s=s.replace(oldSig,newSig);
          if(!s.includes('${nextHtml(next)}'))throw new Error('Patch target missing: next render');
          s=s.replace('${nextHtml(next)}','${nextHtml(next,now)}');

          const api="window.BOS_MASTER_DAILY_HOME_V127_API={refresh:schedule,step,attentionReason};";
          if(!s.includes(api))throw new Error('Patch target missing: API');
          s=s.replace(api,"window.BOS_MASTER_DAILY_HOME_V127_API={refresh:schedule,step,attentionReason,reportOverdue,scheduleEndTs,nextOrder};");
          const resize="window.addEventListener('resize',schedule);\nsetTimeout(schedule,0);";
          if(!s.includes(resize))throw new Error('Patch target missing: timer');
          s=s.replace(resize,"window.addEventListener('resize',schedule);\nsetInterval(schedule,60000);\nsetTimeout(schedule,0);");

          const media='@media(max-width:520px)';
          if(!s.includes(media))throw new Error('Patch target missing: CSS');
          s=s.replace(media,`.masterV127Next.reportOverdue{border-color:rgba(239,68,68,.78);background:linear-gradient(135deg,rgba(127,29,29,.34),rgba(239,68,68,.12));box-shadow:0 0 0 1px rgba(239,68,68,.12) inset}.masterV127Next.reportOverdue .masterV127When{background:rgba(239,68,68,.16)}.masterV127Next.reportOverdue .masterV127Main>small,.masterV127Next.reportOverdue .masterV127Arrow{color:#ff9a9a}.masterV127Next.reportOverdue .masterV127Main strong{background:rgba(239,68,68,.17);color:#ffc1c1}.masterV127ReportReminder{display:block;margin-top:8px;color:#ff9a9a;font-size:12px;font-weight:900;line-height:1.25}\n${media}`);
          fs.writeFileSync(sourcePath,s);

          const testPath='tests/master-daily-home-v127.spec.js';
          let t=fs.readFileSync(testPath,'utf8');
          const marker="master v127 keeps started request until report and marks overdue red";
          if(!t.includes(marker))t+=`\n\ntest('${marker}',async({page})=>{\n  await page.clock.setFixedTime(new Date('2099-09-10T15:31:00'));\n  const {db,master}=await fullStack(page,'master');\n  const current=db.tables.orders.find(o=>String(o.id)==='11')||db.tables.orders[0];\n  const future=db.tables.orders.find(o=>String(o.id)==='12')||db.tables.orders[1];\n  Object.assign(current,{master_staff_id:master.id,scheduled_date:'2099-09-10',scheduled_time:'10:00',time_slot:'10:00–14:00',status:'В работе',master_called_at:'2099-09-10T09:00:00.000Z',master_agreed_at:'2099-09-10T09:05:00.000Z',master_workflow_stage:'started',report_uploaded_at:null,report_act_url:null,report_review_status:null});\n  Object.assign(future,{master_staff_id:master.id,scheduled_date:'2099-09-10',scheduled_time:'18:00',time_slot:'18:00–19:00',status:'В работе',master_called_at:null,master_agreed_at:null,master_workflow_stage:'assigned',report_uploaded_at:null,report_act_url:null,report_review_status:null});\n\n  await page.goto('/',{waitUntil:'domcontentloaded'});\n  await expect(page.locator('#authGate')).toBeHidden();\n  await page.waitForFunction(()=>window.BOS_MASTER_DAILY_HOME_V127===true);\n  await page.evaluate(()=>{show('home');window.BOS_MASTER_DAILY_HOME_V127_API.refresh()});\n\n  const card=page.locator('#masterDailyV127 .masterV127Next');\n  await expect(card).toHaveAttribute('data-order-id',String(current.id));\n  await expect(card).toHaveClass(/reportOverdue/);\n  await expect(card).toContainText('ТЕКУЩАЯ ЗАЯВКА');\n  await expect(card).toContainText('Отправьте отчёт по заявке');\n  await expect(page.locator('#masterDailyV127 .masterV127AttentionItem').filter({hasText:'Отчёт не отправлен вовремя'})).toHaveCount(1);\n\n  await page.evaluate(({id})=>{const o=state.orders.find(x=>String(x.id)===String(id));o.report_uploaded_at='2099-09-10T15:32:00.000Z';o.report_act_url='https://example.test/report-current.pdf';window.BOS_MASTER_DAILY_HOME_V127_API.refresh()},{id:current.id});\n  await expect(card).toHaveAttribute('data-order-id',String(future.id));\n  await expect(card).not.toHaveClass(/reportOverdue/);\n  await expect(card).not.toContainText('Отправьте отчёт по заявке');\n});\n`;
          fs.writeFileSync(testPath,t);
          NODE
      - name: Refresh generated build artifacts
        run: npm run build
      - name: Commit focused change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add master-daily-home-v127.js tests/master-daily-home-v127.spec.js build-version.js index.html sw.js
          git diff --cached --quiet && exit 0
          git commit -m "feat: keep master order until report submission"
          git push
