name: Recovery package
on:
  pull_request:
    paths:
      - 'deploy/recovery/**'
      - '.github/workflows/recovery-package.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docker-export:
    name: Docker export (${{ matrix.store }})
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - store: classic
            version: v28.5.2
            containerd: false
          - store: containerd
            version: v29.9.3
            containerd: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Start a disposable Docker daemon with an explicit image store
        id: engine
        uses: docker/setup-docker-action@3f1ab1ab0e29231562e4db4ca600c1a49653bac6 # v5.7.0
        with:
          version: ${{ matrix.version }}
          daemon-config: |
            {"features":{"containerd-snapshotter":${{ matrix.containerd }}}}
      - name: Pull the fixed public PostgreSQL fixture
        env:
          FIXTURE_DOCKER_HOST: ${{ steps.engine.outputs.sock }}
        run: docker --host "$FIXTURE_DOCKER_HOST" image pull --quiet docker.io/library/postgres:17.6
      - name: Verify real Docker exports by actual inspect identities
        env:
          BOS_RECOVERY_DOCKER_TEST: '1'
          BOS_RECOVERY_DOCKER_SOCKET: ${{ steps.engine.outputs.sock }}
          BOS_RECOVERY_DOCKER_STORE: ${{ matrix.store }}
          BOS_RECOVERY_DOCKER_VERSION: ${{ matrix.version }}
        run: python3 deploy/recovery/test_docker.py --require
      - name: Restore a real synthetic bundle through the operator drill
        env:
          BOS_RECOVERY_DOCKER_TEST: '1'
          BOS_RECOVERY_DOCKER_SOCKET: ${{ steps.engine.outputs.sock }}
          BOS_RECOVERY_DOCKER_STORE: ${{ matrix.store }}
          BOS_RECOVERY_DOCKER_VERSION: ${{ matrix.version }}
        run: python3 deploy/recovery/test_drill_integration.py --require

  windows-launcher:
    name: Windows PowerShell 5.1 launcher
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test installed and portable Python launch paths
        shell: powershell
        run: ./deploy/recovery/test_launcher.ps1

  recovery:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Safety regressions and deterministic operator package
        run: |
          python3 -m unittest discover -s deploy/recovery -p 'test_*.py'
          python3 deploy/recovery/build.py
          git diff --exit-code -- deploy/recovery/bos-backup.pyz
          python3 deploy/recovery/bos-backup.pyz --help
          python3 deploy/recovery/build_drill.py
          git diff --exit-code -- deploy/recovery/bos-restore.pyz deploy/recovery/restore.ps1
          python3 deploy/recovery/bos-restore.pyz --help
      - name: Build disposable PostgreSQL test environment
        run: docker build -f deploy/recovery/test.Dockerfile -t bos-recovery-test deploy/recovery
      - name: Real dump and restore with networking disabled
        run: >-
          docker run --rm --network none --read-only
          --tmpfs /tmp:rw,noexec,nosuid,size=1g
          --mount type=bind,src=${{ github.workspace }},dst=/repo,readonly
          bos-recovery-test
