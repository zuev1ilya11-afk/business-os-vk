name: UI smoke
on:
  push:
    branches: [main, feat/web-push-v211]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_PASSWORD: disposable-test-password
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Generate build artifacts
        run: npm run build
      - name: Commit generated build
        if: github.event_name == 'pull_request'
        run: |
          if ! git diff --quiet -- index.html sw.js build-version.js startup-shell.bundle.js startup-eager.bundle.js; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add index.html sw.js build-version.js startup-shell.bundle.js startup-eager.bundle.js
            git commit -m "Собрать PWA assets"
            git push origin HEAD:${{ github.head_ref }}
          fi
      - name: Verify single build version
        run: npm run build:check

      # ubuntu-latest already provides the browser runtime dependencies we need.
      # Installing them again through apt made PR checks spend most of their time
      # in `playwright install --with-deps` before any project tests could run.
      - name: Install Chromium for Playwright
        run: npx playwright install chromium

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.7
      - name: Master workflow and report functions TypeScript
        run: >-
          deno check --node-modules-dir=none --no-lock
          supabase/functions/mini-app-api/index.ts
          supabase/functions/hands-api/index.ts
          supabase/functions/master-workflow-api/index.ts
          supabase/functions/order-lifecycle-api/index.ts
          supabase/functions/report-api/index.ts
          supabase/functions/profile-self-api/index.ts
      - name: Frozen push sender dependencies and TypeScript
        working-directory: supabase/functions/push-api
        run: |
          node - <<'JS'
          const fs=require('node:fs');
          const c=JSON.parse(fs.readFileSync('deno.json'));
          if(c.lock?.frozen!==true||!fs.statSync('deno.lock').size)throw Error('A frozen sender lockfile is required');
          JS
          deno check index.ts
          deno test --allow-env --allow-read webpush-runtime.test.ts

      - name: Frozen Avito assistant dependencies and TypeScript
        working-directory: supabase/functions/avito-assistant-api
        run: deno check index.ts

      - name: Frozen Hands report worker dependencies and TypeScript
        working-directory: supabase/functions/hands-report-api
        run: deno check index.ts

      - name: Production order-trigger contract in disposable PostgreSQL
        env:
          BOS_TEST_POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          bash scripts/test-order-guards.sh
          bash scripts/test-push.sh
          bash scripts/test-avito-assistant.sh
          bash scripts/test-hands-reports.sh
          bash scripts/test-control-tasks.sh

      - name: Server authorization, payroll and gateway regressions
        run: npm run test:server

      - name: Complete Playwright suite
        run: npm run test:ui -- --workers=2

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
