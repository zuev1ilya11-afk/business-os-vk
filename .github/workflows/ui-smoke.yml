name: UI smoke
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - run: npx playwright install --with-deps chromium

      - name: Core UI smoke
        run: npx playwright test tests/smoke.spec.js

      - name: Master mobile flow
        run: npx playwright test tests/master-mobile.spec.js

      - name: VK signed launch auth
        run: npx playwright test tests/mobile-auth-fallback.spec.js

      - name: VK Bridge launch params
        run: npx playwright test tests/mobile-auth-launch-recovery.spec.js

      - name: Desktop password login
        run: npx playwright test tests/simple-desktop-auth.spec.js

      - name: Business rules regressions
        run: npx playwright test tests/business-rules-regression.spec.js

      - name: Staff access administration
        run: npx playwright test tests/staff-admin.spec.js

      - name: Field regressions
        run: npx playwright test tests/field-regressions.spec.js

      - name: Phone registration
        run: npx playwright test tests/phone-registration.spec.js

      - name: Password login gateway
        run: npx playwright test tests/password-login-gateway.spec.js

      - name: Claims gateway
        run: npx playwright test tests/claims-gateway.spec.js

      - name: Google Apps Script archive deployment health
        run: npx playwright test tests/gas-archive-health.spec.js
