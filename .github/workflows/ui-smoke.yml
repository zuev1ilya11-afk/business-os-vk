name: UI smoke
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npx playwright install --with-deps chromium

      - name: Server authorization, payroll and gateway regressions
        run: npm run test:server

      - name: Complete Playwright suite
        run: |
          set +e
          npm run test:ui -- --workers=2 --reporter=line > playwright-output.txt 2>&1
          code=$?
          cat playwright-output.txt
          echo "$code" > playwright-exit-code.txt
          exit $code

      - name: Upload Playwright diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-diagnostics
          path: |
            playwright-output.txt
            playwright-exit-code.txt
            test-results/
          if-no-files-found: ignore
