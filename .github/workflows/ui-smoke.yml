name: UI smoke
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      # ubuntu-latest already provides the browser runtime dependencies we need.
      # Installing them again through apt made PR checks spend most of their time
      # in `playwright install --with-deps` before any project tests could run.
      - name: Install Chromium for Playwright
        run: npx playwright install chromium

      - name: Server authorization, payroll and gateway regressions
        run: npm run test:server

      - name: Mobile dispatcher regression
        run: npx playwright test tests/dispatcher-mobile-v97.spec.js --workers=1

      - name: Complete Playwright suite
        run: npm run test:ui -- --workers=2

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/