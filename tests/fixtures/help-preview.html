<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Business OS — проверка подсказок</title>
<style>body{margin:0;background:#0c1728;color:#edf4ff;font:16px/1.5 system-ui;padding:24px}main{max-width:720px;margin:auto}button,select{font:inherit;background:#1b2d44;color:#e4efff;border:1px solid #344b68;border-radius:12px;padding:12px;margin:8px 0;min-height:44px}small{color:#a3b6cd}label{display:block}#session{display:none}</style>
<main><h1>Подсказки по работе</h1><p>Изолированный тестовый стенд Business OS</p><p><small>Тестовые сотрудники. Изменения записываются в базу этого стенда и доступны другим тестовым сотрудникам. Рабочий сервер компании не подключён.</small></p>
<form id="login"><label>Тестовый сотрудник<select name="role"><option value="owner">Владелец</option><option value="manager">Руководитель</option><option value="master">Мастер</option></select></label><button>Войти</button></form><div id="session"><p id="who"></p><button id="open">Подсказки по работе</button> <button id="logout">Выйти</button></div><div id="content"></div><div id="modalRoot"></div></main>
<script>window.state={user:null};let session='';window.BOS_AUTH_HEADERS=async()=>({'X-BOS-Session':session});document.getElementById('login').onsubmit=async event=>{event.preventDefault();const r=await fetch('/preview/session',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({role:event.target.elements.role.value})});const d=await r.json();state.user=d.user;session=d.token;document.getElementById('who').textContent={owner:'Кабинет владельца',manager:'Кабинет руководителя',master:'Кабинет мастера'}[d.user.role];document.getElementById('session').style.display='block';event.target.style.display='none'};document.getElementById('open').onclick=()=>openMasterHelp();document.getElementById('logout').onclick=()=>{session='';state.user=null;document.getElementById('session').style.display='none';document.getElementById('login').style.display='block'};</script><script src="master-help-entry.js"></script></html>
