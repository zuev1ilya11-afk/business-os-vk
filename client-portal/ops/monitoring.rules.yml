# Load only into an already isolated monitoring instance after target review.
# No receiver destinations, production URLs, webhook secrets or labels with PII.
groups:
  - name: business_os_client_portal
    rules:
      - alert: PortalApiUnavailable
        expr: up{job="client-portal"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Клиентский API недоступен"
      - alert: StaffApiUnavailable
        expr: probe_success{job="staff-api-health"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Внутренний API недоступен"
      - alert: HostAvailableMemoryLow
        expr: node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes < 0.15
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Доступная RAM меньше 15%"
      - alert: HostDiskSpaceLow
        expr: node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs"} / node_filesystem_size_bytes{fstype!~"tmpfs|overlay|squashfs"} < 0.15
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Свободное место меньше 15%"
      - alert: HostCpuBusy
        expr: 1 - avg by(instance)(rate(node_cpu_seconds_total{mode="idle"}[5m])) > 0.85
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Загрузка CPU выше 85%"
      # Application/outbox metrics must be exported before enabling these two rules.
      - alert: PortalDeliveryFailures
        expr: increase(bos_portal_notification_failures_total[15m]) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Ошибки доставки клиентских уведомлений"
      - alert: PortalBackgroundJobStalled
        expr: time() - bos_portal_background_last_success_seconds > 600
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Фоновая задача не завершалась более 10 минут"
