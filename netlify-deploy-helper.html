<!doctype html><html><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><title>Netlify deploy helper</title></head><body><pre id="status">Preparing deploy…</pre><script>(()=>{'use strict';const out=document.getElementById('status');const p=new URLSearchParams(location.hash.slice(1));const proxy=p.get('proxy');const artifact=p.get('artifact');const site=p.get('site');if(!proxy||!artifact||!site){out.textContent='Missing deploy parameters';return;}history.replaceState(null,'',location.pathname);(async()=>{try{out.textContent='Downloading snapshot…';const source=await fetch(artifact,{cache:'no-store'});if(!source.ok)throw new Error('Snapshot download failed: '+source.status);const zip=await source.blob();out.textContent='Uploading snapshot to Netlify…';const form=new FormData();form.append('zip',zip,'business-os.zip');const url=proxy.replace(/\/$/,'')+'/api/v1/sites/'+encodeURIComponent(site)+'/builds';await fetch(url,{method:'POST',body:form,mode:'no-cors'});out.textContent='Upload request sent';}catch(error){out.textContent='Deploy helper error: '+(error?.message||String(error));}})();})();</script></body></html>
