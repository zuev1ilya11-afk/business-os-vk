<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07111f">
<title>Домашний мастер — Business OS</title>
<style>
:root{--bg:#07111f;--panel:#0f1d2e;--panel2:#13263b;--line:#29425f;--text:#f5f8fc;--muted:#8fa5bc;--blue:#3998ff;--blue2:#227ddd;--green:#38c98a;--red:#ff7070;--r:22px}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}#app{width:min(100%,1050px);margin:auto;padding:22px 18px 105px}.top{display:none;align-items:center;justify-content:space-between;margin-bottom:24px}.brand{display:flex;align-items:center;gap:12px}.logo,.avatar{width:48px;height:48px;border-radius:16px;background:linear-gradient(145deg,#45a8ff,#247ddd);display:grid;place-items:center}.avatar{border:0;color:#fff;font-weight:900}.title{font-size:19px;font-weight:900}.sub,.muted{color:var(--muted)}.sub{font-size:12px}.role{display:inline-block;margin-top:4px;padding:3px 8px;border:1px solid #31587d;border-radius:999px;font-size:11px;color:#b8dcff}.head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:16px}.head h1{margin:0;font-size:32px}.head p{margin:5px 0 0}.card{background:linear-gradient(155deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:var(--r);padding:18px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.metric strong{display:block;font-size:30px;margin-top:10px}.metric span{color:var(--muted);font-size:13px}.list{display:grid;gap:10px}.section{margin-top:20px}.section h2{font-size:19px}.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.click{cursor:pointer}.click:hover{border-color:#4a7cad}.meta{color:var(--muted);font-size:12px;display:flex;gap:8px 14px;flex-wrap:wrap;margin-top:8px}.amount{font-weight:900;font-size:18px}.status{font-size:11px;font-weight:800;border-radius:999px;padding:5px 8px;background:#12304f;color:#b5dcff}.done{background:#123b2b;color:#b9efd3}.cancel{background:#3c2028;color:#ffc5c5}.primary,.secondary,.ghost{border:0;border-radius:14px;min-height:46px;padding:10px 15px;color:#fff;font-weight:800}.primary{background:linear-gradient(145deg,var(--blue),var(--blue2))}.secondary{background:#1c2d42;border:1px solid #344b65}.ghost{background:transparent;border:1px solid #344b65;color:#c2d1e1}.wide{width:100%}.form{display:grid;gap:11px}.form label{font-size:12px;font-weight:800;color:#b9c8d8;margin-bottom:-5px}.form input,.form select,.form textarea{width:100%;min-height:50px;border:1px solid #304a67;border-radius:14px;background:#102136;color:#fff;padding:12px 13px;outline:0}.form textarea{min-height:86px;resize:vertical}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.hint{font-size:11px;color:#718aa2}.empty{padding:28px;text-align:center;border:1px dashed #2b425b;border-radius:18px;color:var(--muted)}.nav{display:none;position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(100%,1050px);grid-template-columns:repeat(5,1fr);background:rgba(6,14,25,.97);border-top:1px solid #20364e;padding:7px 8px calc(7px + env(safe-area-inset-bottom));z-index:30}.nav button{border:0;background:transparent;color:#8297ae;min-height:58px;border-radius:12px;font-size:11px;font-weight:800}.nav button.active{color:#6cb7ff;background:#10243a}.ico{display:block;font-size:19px;margin-bottom:3px}.modalBack{position:fixed;inset:0;background:rgba(0,0,0,.74);z-index:100;display:flex;align-items:flex-end;justify-content:center}.modal{position:relative;width:min(100%,640px);max-height:92vh;overflow:auto;background:#0b1928;border:1px solid #2d455f;border-radius:26px 26px 0 0;padding:52px 18px calc(24px + env(safe-area-inset-bottom))}.close{position:absolute;right:12px;top:10px;width:40px;height:40px;border-radius:50%;border:1px solid #38516b;background:#172a40;color:#fff;font-size:24px}.loginWrap{min-height:72vh;display:grid;place-items:center}.login{width:min(100%,430px)}.error{color:#ffadad;font-size:12px}.success{color:#a4eac7;font-size:12px}.servicePlaceholder{color:#8098af;font-style:italic}.employeeCard{display:block;width:100%;text-align:left;color:#fff}.employeeCard button{pointer-events:none}.masterTag{font-size:11px;color:#afd6ff}.scheduleCard{cursor:pointer}@media(max-width:720px){#app{padding:15px 12px 98px}.head h1{font-size:26px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.grid .metric:last-child:nth-child(odd){grid-column:1/-1}.two{grid-template-columns:1fr}.head{align-items:center}.card{padding:15px}.title{font-size:17px}.logo,.avatar{width:44px;height:44px}.meta{display:grid;gap:4px}.amount{font-size:16px}}@media(min-width:800px){.modalBack{align-items:center}.modal{border-radius:24px}.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
</style>
</head>
<body>
<div id="app">
<header id="top" class="top"><div class="brand"><div class="logo">🏠</div><div><div class="title">Домашний мастер</div><div class="sub">Business OS</div><div id="roleBadge" class="role">—</div></div></div><button id="avatar" class="avatar">П</button></header>
<main id="content"></main>
</div>
<nav id="nav" class="nav"><button data-page="home"><span class="ico">⌂</span>Главная</button><button data-page="orders"><span class="ico">▤</span>Заявки</button><button data-page="dispatch"><span class="ico">▦</span>График</button><button data-page="team"><span class="ico">👥</span>Команда</button><button data-page="profile"><span class="ico">◉</span>Профиль</button></nav>
<div id="modalRoot"></div>
<script>
(function(){
'use strict';
var API='https://obsropbslfwtanyspjbi.supabase.co/functions/v1/mini-app-api';
var PIN_API='https://obsropbslfwtanyspjbi.supabase.co/functions/v1/test-pin-session';
var KEY='bos_v2_session';
var state={user:null,orders:[],users:[],masters:[],schedule:[],page:'home',dispatchMaster:''};
var slots=[];for(var h=10;h<21;h++)slots.push(pad(h)+':00–'+pad(h+1)+':00');
function pad(n){return String(n).padStart(2,'0')}
function el(id){return document.getElementById(id)}
function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function role(r){return {owner:'Владелец',manager:'Руководитель',dispatcher:'Диспетчер',master:'Мастер'}[r]||r||'Сотрудник'}
function sess(){try{return localStorage.getItem(KEY)||''}catch(e){return ''}}
function saveSess(v){try{localStorage.setItem(KEY,v)}catch(e){}}
function clearSess(){try{localStorage.removeItem(KEY)}catch(e){}}
function money(n){return Number(n||0).toLocaleString('ru-RU',{maximumFractionDigits:2})+' ₽'}
function shell(on){el('top').style.display=on?'flex':'none';el('nav').style.display=on?'grid':'none'}
function html(x){el('content').innerHTML=x}
function api(action,p){return fetch(API,{method:'POST',headers:{'Content-Type':'application/json','X-BOS-Session':sess()},body:JSON.stringify(Object.assign({action:action},p||{}))}).then(function(r){return r.json().then(function(d){if(r.status===401){clearSess();throw new Error('Сессия завершена')};if(!r.ok||d.ok===false)throw new Error(d.error||('Ошибка сервера '+r.status));return d})})}
function roleChrome(){el('roleBadge').textContent=role(state.user&&state.user.role);el('avatar').textContent=((state.user&&state.user.full_name)||'П').trim().charAt(0).toUpperCase();document.querySelectorAll('#nav button').forEach(function(b){b.classList.toggle('active',b.dataset.page===state.page)})}
function showLogin(msg){shell(false);html('<div class="loginWrap"><section class="card login"><div class="hint">BUSINESS OS</div><h1>Домашний мастер</h1><p class="muted">Тестовый вход</p><form id="pinForm" class="form"><label>PIN-код</label><input id="pin" inputmode="numeric" maxlength="6" placeholder="Введите PIN" required><button class="primary wide">Войти</button><p id="msg" class="error">'+esc(msg||'')+'</p></form></section></div>');el('pinForm').onsubmit=function(e){e.preventDefault();var m=el('msg');m.textContent='Входим…';fetch(PIN_API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({pin:el('pin').value})}).then(function(r){return r.json().then(function(d){return {r:r,d:d}})}).then(function(x){if(!x.r.ok||!x.d.ok)throw new Error(x.d.error||'Ошибка входа');saveSess(x.d.session_token);return load()}).catch(function(e){m.textContent=e.message||'Ошибка входа'})}}
function load(){shell(false);html('<div class="loginWrap"><section class="card login"><h2>Загрузка…</h2><p class="muted">Получаем данные</p></section></div>');api('bootstrap').then(function(d){state.user=d.user||{};state.orders=d.orders||[];state.users=d.users||[];state.masters=d.masters||[];state.schedule=d.masterSchedule||[];shell(true);show('home')}).catch(function(e){clearSess();showLogin(e.message)})}
function show(page){state.page=page;roleChrome();if(page==='home')home();else if(page==='orders')orders();else if(page==='dispatch')dispatch();else if(page==='team')team();else profile()}
function home(){var active=state.orders.filter(function(o){return o.status==='В работе'}).length,done=state.orders.filter(function(o){return o.status==='Выполнена'}).length;html('<div class="head"><div><h1>Главная</h1><p class="muted">Рабочая сводка</p></div><button id="quick" class="primary">+ Заявка</button></div><div class="grid"><section class="card metric"><span>Заявок</span><strong>'+state.orders.length+'</strong></section><section class="card metric"><span>В работе</span><strong>'+active+'</strong></section><section class="card metric"><span>Выполнено</span><strong>'+done+'</strong></section><section class="card metric"><span>Мастеров</span><strong>'+state.masters.length+'</strong></section></div><section class="section"><h2>Последние заявки</h2><div class="list">'+orderCards(state.orders.slice(0,5))+'</div></section>');el('quick').onclick=openNewOrder;bindOrderCards()}
function orderCards(arr){if(!arr.length)return '<div class="empty">Заявок пока нет</div>';return arr.map(function(o){var sc=o.status==='Выполнена'?'done':o.status==='Отменена'?'cancel':'';return '<article class="card click" data-order="'+esc(o.id)+'"><div class="row"><b>'+esc(o.client||'Клиент')+'</b><span class="status '+sc+'">'+esc(o.status||'В работе')+'</span></div><div style="margin-top:7px;font-weight:800">'+esc(o.work||'Работа')+'</div><div class="meta"><span>'+esc(o.city||'')+(o.address?' · '+esc(o.address):'')+'</span><span>'+esc(o.scheduled_date||'')+' '+esc(o.time_slot||o.scheduled_time||'')+'</span><span>'+esc(o.master_name||'Мастер не назначен')+'</span></div><div class="row" style="margin-top:10px"><span></span><span class="amount">'+money(o.amount)+'</span></div></article>'}).join('')}
function bindOrderCards(){document.querySelectorAll('[data-order]').forEach(function(x){x.onclick=function(){openOrder(x.dataset.order)}})}
function orders(){html('<div class="head"><div><h1>Заявки</h1><p class="muted">'+state.orders.length+' заявок</p></div><button id="addOrder" class="primary">+ Новая</button></div><div class="list">'+orderCards(state.orders)+'</div>');el('addOrder').onclick=openNewOrder;bindOrderCards()}
function masterOptions(selected){return '<option value="">Назначить позже</option>'+state.masters.map(function(m){var id=String(m.external_id||m.vk_user_id||m.id||'');return '<option value="'+esc(id)+'" data-city="'+esc(m.city||'')+'" '+(String(selected||'')===id?'selected':'')+'>'+esc(m.full_name||'Мастер')+(m.city?' — '+esc(m.city):'')+'</option>'}).join('')}
function slotOptions(selected){return '<option value="">Выберите интервал</option>'+slots.map(function(s){return '<option '+(String(selected||'')===s?'selected':'')+'>'+s+'</option>'}).join('')}
function phoneField(id,value){var digits=String(value||'').replace(/\D/g,'');if(digits.charAt(0)==='7'||digits.charAt(0)==='8')digits=digits.slice(1);digits=digits.slice(0,10);return '<div><label>Телефон</label><div class="row" style="gap:7px"><div class="card" style="padding:14px;min-width:54px;text-align:center">+7</div><input id="'+id+'" inputmode="numeric" maxlength="10" value="'+esc(digits)+'" placeholder="9991234567"></div><div class="hint">После +7 введите 10 цифр</div></div>'}
function phoneValue(id){return '+7'+String(el(id).value||'').replace(/\D/g,'').slice(0,10)}
function bindDigits(id){el(id).addEventListener('input',function(){this.value=this.value.replace(/\D/g,'').slice(0,10)})}
function openNewOrder(){modal('<h2>Новая заявка</h2><form id="orderForm" class="form"><label>Клиент</label><input id="client" required placeholder="Имя клиента">'+phoneField('phone','')+'<label>Мастер</label><select id="master">'+masterOptions('')+'</select><label>Город</label><input id="city" placeholder="Город"><label>Адрес</label><input id="address" required placeholder="Улица, дом, квартира"><label>Работа</label><select id="work" required><option value="">Выберите услугу</option><option disabled class="servicePlaceholder">Список услуг добавим из файла</option><option value="Другое">Другое</option></select><input id="workOther" style="display:none" placeholder="Опишите работу"><div class="two"><div><label>Дата выполнения</label><input id="date" type="date"></div><div><label>Интервал времени</label><select id="slot">'+slotOptions('')+'</select></div></div><label>Стоимость</label><input id="amount" type="number" min="0" step="1" placeholder="₽"><label>Комментарий</label><textarea id="comment" placeholder="Комментарий к заявке"></textarea><button class="primary wide">Создать заявку</button><p id="formMsg" class="error"></p></form>');bindDigits('phone');el('master').onchange=function(){var op=this.options[this.selectedIndex];if(op&&op.value&&op.dataset.city)el('city').value=op.dataset.city};el('work').onchange=function(){el('workOther').style.display=this.value==='Другое'?'block':'none'};el('orderForm').onsubmit=function(e){e.preventDefault();var msg=el('formMsg');var wd=el('work').value==='Другое'?el('workOther').value.trim():el('work').value;if(!wd){msg.textContent='Укажите работу';return}var ph=phoneValue('phone');if(ph.length!==12){msg.textContent='Введите 10 цифр телефона после +7';return}var sl=el('slot').value;msg.textContent='Создаём…';api('createOrder',{client:el('client').value.trim(),phone:ph,master_vk_id:el('master').value,city:el('city').value.trim(),address:el('address').value.trim(),work:wd,scheduled_date:el('date').value||null,scheduled_time:sl?sl.slice(0,5):null,time_slot:sl,amount:Number(el('amount').value||0),comment:el('comment').value.trim()}).then(function(d){state.orders.unshift(d.order);closeModal();show('orders')}).catch(function(e){msg.textContent=e.message})}}
function openOrder(id){var o=state.orders.find(function(x){return String(x.id)===String(id)});if(!o)return;var currentMaster=String(o.master_vk_id||'');modal('<h2>'+esc(o.client||'Заявка')+'</h2><form id="editForm" class="form">'+phoneField('ephone',o.phone)+'<label>Мастер</label><select id="emaster">'+masterOptions(currentMaster)+'</select><label>Город</label><input id="ecity" value="'+esc(o.city||'')+'"><label>Адрес</label><input id="eaddress" value="'+esc(o.address||'')+'"><label>Работа</label><input id="ework" value="'+esc(o.work||'')+'"><div class="two"><div><label>Дата выполнения</label><input id="edate" type="date" value="'+esc(o.scheduled_date||'')+'"></div><div><label>Интервал времени</label><select id="eslot">'+slotOptions(o.time_slot||'')+'</select></div></div><label>Статус</label><select id="estatus"><option '+(o.status==='В работе'?'selected':'')+'>В работе</option><option '+(o.status==='Выполнена'?'selected':'')+'>Выполнена</option><option '+(o.status==='Отменена'?'selected':'')+'>Отменена</option></select><label>Стоимость</label><input id="eamount" type="number" min="0" value="'+esc(o.original_amount||o.amount||0)+'"><label>Комментарий</label><textarea id="ecomment">'+esc(o.comment||'')+'</textarea><button class="primary wide">Сохранить</button><p id="editMsg" class="error"></p></form>');bindDigits('ephone');el('emaster').onchange=function(){var op=this.options[this.selectedIndex];if(op&&op.value&&op.dataset.city)el('ecity').value=op.dataset.city};el('editForm').onsubmit=function(e){e.preventDefault();var sl=el('eslot').value,msg=el('editMsg');msg.textContent='Сохраняем…';api('updateOrder',{id:o.id,phone:phoneValue('ephone'),master_vk_id:el('emaster').value,city:el('ecity').value.trim(),address:el('eaddress').value.trim(),work:el('ework').value.trim(),scheduled_date:el('edate').value||null,scheduled_time:sl?sl.slice(0,5):null,time_slot:sl,status:el('estatus').value,original_amount:Number(el('eamount').value||0),comment:el('ecomment').value.trim()}).then(function(d){var i=state.orders.findIndex(function(x){return String(x.id)===String(o.id)});state.orders[i]=d.order;closeModal();show('orders')}).catch(function(e){msg.textContent=e.message})}}
function team(){var can=state.user&&state.user.role==='owner';html('<div class="head"><div><h1>Команда</h1><p class="muted">'+state.users.length+' сотрудников</p></div>'+(can?'<button id="addEmp" class="primary">+ Сотрудник</button>':'')+'</div><div class="list">'+(state.users.length?state.users.map(function(u){var id=String(u.external_id||u.vk_user_id||u.id||'');return '<article class="card click employeeCard" data-emp="'+esc(id)+'"><div class="row"><div><b>'+esc(u.full_name||'')+'</b><div class="masterTag">'+esc(role(u.role))+'</div></div><span>›</span></div><div class="meta"><span>'+esc(u.city||'Город не указан')+'</span><span>'+esc(u.phone||'')+'</span><span>'+esc(u.specialization||'')+'</span></div></article>'}).join(''):'<div class="empty">Сотрудников нет</div>')+'</div>');if(can)el('addEmp').onclick=openEmployee;document.querySelectorAll('[data-emp]').forEach(function(x){x.onclick=function(){openEmployeeCard(x.dataset.emp)}})}
function openEmployee(){modal('<h2>Новый сотрудник</h2><form id="empForm" class="form"><label>Имя</label><input id="ename" required><label>Телефон</label><input id="epphone" placeholder="+7..." required><label>Роль</label><select id="erole"><option value="master">Мастер</option><option value="dispatcher">Диспетчер</option><option value="manager">Руководитель</option></select><label>Город</label><input id="empcity" required placeholder="Москва"><label>Специализация</label><input id="spec"><button class="primary wide">Добавить</button><p id="empMsg" class="error"></p></form>');el('empForm').onsubmit=function(e){e.preventDefault();var m=el('empMsg');m.textContent='Добавляем…';api('addEmployee',{full_name:el('ename').value.trim(),phone:el('epphone').value.trim(),role:el('erole').value,city:el('empcity').value.trim(),specialization:el('spec').value.trim()}).then(function(d){state.users.push(d.user);if(d.master)state.masters.push(d.master);closeModal();show('team')}).catch(function(e){m.textContent=e.message})}}
function findUser(id){return state.users.find(function(u){return String(u.external_id||u.vk_user_id||u.id||'')===String(id)})||state.masters.find(function(u){return String(u.external_id||u.vk_user_id||u.id||'')===String(id)})}
function openEmployeeCard(id){var u=findUser(id);if(!u)return;modal('<h2>'+esc(u.full_name||'Сотрудник')+'</h2><section class="card"><p><b>Роль:</b> '+esc(role(u.role))+'</p><p><b>Город:</b> '+esc(u.city||'—')+'</p><p><b>Телефон:</b> '+esc(u.phone||'—')+'</p><p><b>Специализация:</b> '+esc(u.specialization||'—')+'</p></section>'+(u.role==='master'?'<button id="openSchedule" class="primary wide">Открыть график мастера</button>':'')+'');if(u.role==='master')el('openSchedule').onclick=function(){state.dispatchMaster=id;closeModal();show('dispatch')}}
function dispatch(){var masters=state.masters;var filtered=state.dispatchMaster?masters.filter(function(m){return String(m.external_id||m.vk_user_id||m.id||'')===String(state.dispatchMaster)}):masters;var h='<div class="head"><div><h1>График</h1><p class="muted">Нажми на мастера, чтобы посмотреть его заявки</p></div>'+(state.dispatchMaster?'<button id="allMasters" class="ghost">Все мастера</button>':'')+'</div><div class="list">';if(!filtered.length)h+='<div class="empty">Мастеров нет</div>';filtered.forEach(function(m){var id=String(m.external_id||m.vk_user_id||m.id||''),ords=state.orders.filter(function(o){return String(o.master_vk_id||'')===id&&o.scheduled_date});h+='<article class="card scheduleCard" data-sch="'+esc(id)+'"><div class="row"><div><b>'+esc(m.full_name||'Мастер')+'</b><div class="masterTag">'+esc(m.city||'')+'</div></div><span>'+ords.length+' заявок ›</span></div></article>';if(state.dispatchMaster){ords.sort(function(a,b){return String(a.scheduled_date+a.scheduled_time).localeCompare(String(b.scheduled_date+b.scheduled_time))}).forEach(function(o){h+='<article class="card click" data-order="'+esc(o.id)+'"><div class="row"><b>'+esc(o.scheduled_date||'')+' · '+esc(o.time_slot||o.scheduled_time||'')+'</b><span class="status">'+esc(o.status||'')+'</span></div><div style="margin-top:7px">'+esc(o.work||'Заявка')+'</div><div class="meta"><span>'+esc(o.client||'')+'</span><span>'+esc(o.address||'')+'</span></div></article>'})}});h+='</div>';html(h);if(state.dispatchMaster)el('allMasters').onclick=function(){state.dispatchMaster='';dispatch()};document.querySelectorAll('[data-sch]').forEach(function(x){x.onclick=function(){state.dispatchMaster=x.dataset.sch;dispatch()}});bindOrderCards()}
function profile(){html('<div class="head"><div><h1>Профиль</h1><p class="muted">Настройки текущего пользователя</p></div></div><section class="card"><h2>'+esc(state.user&&state.user.full_name||'')+'</h2><p class="muted">'+esc(role(state.user&&state.user.role))+'</p><button id="logout" class="secondary wide">Выйти</button></section>');el('logout').onclick=function(){clearSess();state.user=null;showLogin('')}}
function modal(body){el('modalRoot').innerHTML='<div class="modalBack"><div class="modal"><button id="close" class="close">×</button>'+body+'</div></div>';el('close').onclick=closeModal}
function closeModal(){el('modalRoot').innerHTML=''}
function bind(){document.querySelectorAll('#nav button').forEach(function(b){b.onclick=function(){show(b.dataset.page)}});el('avatar').onclick=function(){show('profile')}}
function start(){bind();if(sess())load();else showLogin('')}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',start);else start();
})();
</script>
</body>
</html>
