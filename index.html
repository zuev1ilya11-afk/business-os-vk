<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07111f">
<title>Домашний мастер — Business OS</title>
<style>
:root{--bg:#07111f;--panel:#0e1b2b;--panel2:#132338;--line:#263b55;--text:#f5f8fc;--muted:#8fa3ba;--blue:#3897ff;--blue2:#227ce3;--green:#37c987;--amber:#ffba55;--red:#ff6b6b;--r:22px}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}#app{width:min(100%,1100px);margin:0 auto;padding:22px 20px 110px}.topbar{display:none;align-items:center;justify-content:space-between;gap:16px;margin-bottom:26px}.brand{display:flex;align-items:center;gap:13px}.brandIcon,.avatar{width:52px;height:52px;border-radius:17px;display:grid;place-items:center;background:linear-gradient(145deg,#43a5ff,#2378dc);box-shadow:0 10px 28px rgba(42,137,236,.22)}.brandIcon{font-size:24px}.avatar{border:0;color:white;font-weight:800;font-size:18px}.brandTitle{font-size:20px;font-weight:850}.brandSub,.muted{color:var(--muted)}.brandSub{font-size:12px;margin-top:2px}.roleBadge{display:inline-flex;margin-top:5px;padding:4px 9px;border:1px solid #315579;border-radius:999px;color:#b9dcff;font-size:11px;font-weight:700}.pageHead{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;margin:0 0 18px}.pageHead h1{margin:0;font-size:32px;letter-spacing:-.7px}.pageHead p{margin:7px 0 0;color:var(--muted)}.primary,.secondary,.ghost{border:0;border-radius:14px;min-height:46px;padding:10px 16px;color:#fff;font-weight:800}.primary{background:linear-gradient(145deg,var(--blue),var(--blue2));box-shadow:0 8px 22px rgba(48,145,255,.18)}.secondary{background:#1b2b40;border:1px solid #334963}.ghost{background:transparent;border:1px solid #31465f;color:#bed0e3}.wide{width:100%}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.metric{position:relative;overflow:hidden;min-height:140px}.metric:after{content:"";position:absolute;width:110px;height:110px;border-radius:50%;right:-35px;top:-35px;background:rgba(73,158,255,.1)}.card,.hero{background:linear-gradient(160deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:var(--r);padding:20px}.metricLabel{color:var(--muted);font-size:13px;font-weight:700}.metric strong{display:block;font-size:34px;margin-top:16px;letter-spacing:-1px}.section{margin-top:18px}.sectionTitle{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.sectionTitle h2{font-size:19px;margin:0}.list{display:grid;gap:10px}.orderCard,.employeeCard,.scheduleCard{background:#0d1928;border:1px solid #22364e;border-radius:18px;padding:16px}.orderCard{cursor:pointer;transition:.15s}.orderCard:hover{border-color:#3b6f9f;transform:translateY(-1px)}.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.orderTitle{font-size:16px;font-weight:800}.orderMeta{display:flex;flex-wrap:wrap;gap:7px 12px;color:var(--muted);font-size:12px;margin-top:8px}.amount{font-size:18px;font-weight:900;white-space:nowrap}.status{display:inline-flex;align-items:center;border-radius:999px;padding:5px 9px;font-size:11px;font-weight:800}.s-work{color:#a8d5ff;background:#112c47;border:1px solid #2c608d}.s-done{color:#baf3d7;background:#103626;border:1px solid #266b4d}.s-cancel{color:#ffc3c3;background:#3c1e25;border:1px solid #73414a}.empty{text-align:center;color:var(--muted);padding:34px 18px;border:1px dashed #2c4058;border-radius:18px}.form{display:grid;gap:12px}.form label{font-size:12px;color:#b6c5d6;font-weight:800;margin:2px 0 -5px}.form input,.form select,.form textarea{width:100%;min-height:50px;border-radius:14px;border:1px solid #304861;background:#101f31;color:white;padding:12px 14px;outline:0}.form input:focus,.form select:focus,.form textarea:focus{border-color:#4b9df0;box-shadow:0 0 0 3px rgba(64,151,239,.1)}.form textarea{min-height:90px;resize:vertical}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.modalBack{position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:100;display:flex;align-items:flex-end;justify-content:center}.modal{width:min(100%,620px);max-height:92vh;overflow:auto;background:#0d1928;border:1px solid #2b4058;border-radius:26px 26px 0 0;padding:54px 20px calc(26px + env(safe-area-inset-bottom));position:relative}.modal h2{margin:0 0 18px}.close{position:absolute;right:14px;top:12px;width:38px;height:38px;border-radius:50%;border:1px solid #354b65;background:#192b40;color:#fff;font-size:24px}.notice{padding:12px 14px;border-radius:14px;background:#10243b;border:1px solid #285279;color:#acd4ff;font-size:13px}.error{color:#ffaaaa;font-size:13px}.success{color:#9be6bf;font-size:13px}.loginWrap{min-height:72vh;display:grid;place-items:center}.login{width:min(100%,440px)}.login h1{font-size:32px;margin:5px 0 8px}.eyebrow{font-size:11px;letter-spacing:1.5px;font-weight:900;color:#74b8ff}.bottomNav{display:none;position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(100%,1100px);grid-template-columns:repeat(5,1fr);gap:4px;padding:8px 12px calc(8px + env(safe-area-inset-bottom));background:rgba(6,14,25,.96);backdrop-filter:blur(14px);border-top:1px solid #20344b;z-index:30}.bottomNav button{background:transparent;border:0;color:#8195ac;min-height:58px;font-size:11px;font-weight:700;border-radius:12px}.bottomNav button.active{color:#6ab5ff;background:#10243a}.navIcon{display:block;font-size:20px;margin-bottom:4px}.employeeRole{color:#b8d9ff;font-size:12px}.toolbar{display:flex;gap:8px;flex-wrap:wrap}.chip{border:1px solid #31465f;background:#112033;color:#c0d1e3;border-radius:999px;padding:7px 10px;font-size:12px}.loginHint{margin-top:14px;font-size:12px;color:#70879f}.desktopNote{display:none}@media(min-width:900px){#app{padding-top:30px}.modalBack{align-items:center}.modal{border-radius:24px}.desktopNote{display:block;color:#71869d;font-size:12px}.bottomNav{max-width:1080px}.pageHead h1{font-size:36px}}@media(max-width:720px){#app{padding:16px 13px 100px}.topbar{margin-bottom:20px}.brandIcon,.avatar{width:45px;height:45px;border-radius:14px}.brandTitle{font-size:17px}.pageHead{align-items:center}.pageHead h1{font-size:26px}.pageHead p{font-size:13px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.grid .metric:last-child:nth-child(odd){grid-column:1/-1}.metric{min-height:116px;padding:16px}.metric strong{font-size:29px;margin-top:12px}.card{padding:16px}.two{grid-template-columns:1fr}.orderMeta{display:grid;gap:5px}.amount{font-size:16px}.pageHead .primary{padding:9px 12px;min-height:42px}}
</style>
</head>
<body>
<div id="app">
<header id="topbar" class="topbar"><div class="brand"><div class="brandIcon">🏠</div><div><div class="brandTitle">Домашний мастер</div><div class="brandSub">Business OS</div><div id="roleBadge" class="roleBadge">—</div></div></div><button id="profileBtn" class="avatar">П</button></header>
<main id="content"></main>
</div>
<nav id="nav" class="bottomNav"><button data-page="home"><span class="navIcon">⌂</span>Главная</button><button data-page="orders"><span class="navIcon">▤</span>Заявки</button><button data-page="dispatch"><span class="navIcon">▦</span>График</button><button data-page="team"><span class="navIcon">👥</span>Команда</button><button data-page="profile"><span class="navIcon">◉</span>Профиль</button></nav>
<div id="modalRoot"></div>
<script>
(function(){
'use strict';
var API='https://obsropbslfwtanyspjbi.supabase.co/functions/v1/mini-app-api';
var PIN_API='https://obsropbslfwtanyspjbi.supabase.co/functions/v1/test-pin-session';
var KEY='bos_v2_session';
var state={user:null,orders:[],users:[],masters:[],schedule:[],page:'home'};
function el(id){return document.getElementById(id)}
function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function role(r){return {owner:'Владелец',manager:'Руководитель',dispatcher:'Диспетчер',master:'Мастер'}[r]||r||'Сотрудник'}
function statusClass(s){return s==='Выполнена'?'s-done':s==='Отменена'?'s-cancel':'s-work'}
function money(n){return Number(n||0).toLocaleString('ru-RU',{maximumFractionDigits:2})+' ₽'}
function session(){try{return localStorage.getItem(KEY)||''}catch(e){return ''}}
function save(v){try{localStorage.setItem(KEY,v)}catch(e){}}
function clear(){try{localStorage.removeItem(KEY)}catch(e){}}
function content(h){el('content').innerHTML=h}
function shell(on){el('topbar').style.display=on?'flex':'none';el('nav').style.display=on?'grid':'none'}
function api(action,payload){return fetch(API,{method:'POST',headers:{'Content-Type':'application/json','X-BOS-Session':session()},body:JSON.stringify(Object.assign({action:action},payload||{}))}).then(function(r){return r.json().then(function(d){if(r.status===401){clear();throw new Error('Сессия завершена')};if(!r.ok||d.ok===false)throw new Error(d.error||('Ошибка сервера '+r.status));return d})})}
function refreshChrome(){el('roleBadge').textContent=role(state.user&&state.user.role);el('profileBtn').textContent=((state.user&&state.user.full_name)||'П').trim().charAt(0).toUpperCase();var b=document.querySelectorAll('#nav button');for(var i=0;i<b.length;i++)b[i].classList.toggle('active',b[i].dataset.page===state.page)}
function showLogin(msg){shell(false);content('<div class="loginWrap"><section class="card login"><div class="eyebrow">BUSINESS OS</div><h1>Домашний мастер</h1><p class="muted">Рабочая система сервисной компании</p><form id="pinForm" class="form" style="margin-top:22px"><label>PIN-код</label><input id="pin" inputmode="numeric" maxlength="6" placeholder="Введите 6 цифр" required><button class="primary wide" type="submit">Войти</button><p id="loginMsg" class="error">'+esc(msg||'')+'</p></form><div class="loginHint">Временная авторизация для разработки. VK и Google Drive пока не участвуют.</div></section></div>');el('pinForm').onsubmit=function(e){e.preventDefault();var m=el('loginMsg');m.textContent='Входим…';fetch(PIN_API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({pin:el('pin').value})}).then(function(r){return r.json().then(function(d){return {r:r,d:d}})}).then(function(x){if(!x.r.ok||!x.d.ok)throw new Error(x.d.error||'Ошибка входа');save(x.d.session_token);return load()}).catch(function(e){m.textContent=e.message||'Ошибка входа'})}}
function load(){shell(false);content('<div class="loginWrap"><section class="card login"><h2>Загружаем данные…</h2><p class="muted">Подключаем рабочую базу</p></section></div>');return api('bootstrap').then(function(d){state.user=d.user||{};state.orders=d.orders||[];state.users=d.users||[];state.masters=d.masters||[];state.schedule=d.masterSchedule||[];shell(true);show('home')}).catch(function(e){clear();showLogin(e.message)})}
function show(page){state.page=page;refreshChrome();if(page==='home')home();else if(page==='orders')orders();else if(page==='dispatch')dispatch();else if(page==='team')team();else profile()}
function home(){var active=state.orders.filter(function(o){return o.status==='В работе'}),done=state.orders.filter(function(o){return o.status==='Выполнена'}),rev=done.reduce(function(a,o){return a+Number(o.amount||0)},0);content('<div class="pageHead"><div><h1>Главная</h1><p>Сводка по компании на сейчас</p></div><button id="quickOrder" class="primary">+ Заявка</button></div><div class="grid"><section class="card metric"><span class="metricLabel">Всего заявок</span><strong>'+state.orders.length+'</strong></section><section class="card metric"><span class="metricLabel">В работе</span><strong>'+active.length+'</strong></section><section class="card metric"><span class="metricLabel">Мастеров</span><strong>'+state.masters.length+'</strong></section><section class="card metric"><span class="metricLabel">Выполнено</span><strong>'+done.length+'</strong></section><section class="card metric"><span class="metricLabel">Выручка по выполненным</span><strong>'+money(rev)+'</strong></section></div><section class="section"><div class="sectionTitle"><h2>Последние заявки</h2><button id="allOrders" class="ghost">Все заявки</button></div><div class="list">'+orderCards(state.orders.slice(0,5))+'</div></section>');el('quickOrder').onclick=openOrderForm;el('allOrders').onclick=function(){show('orders')};bindOrderCards()}
function orderCards(arr){if(!arr.length)return '<div class="empty">Заявок пока нет</div>';return arr.map(function(o){return '<article class="orderCard" data-id="'+esc(o.id)+'"><div class="row"><div><div class="orderTitle">'+esc(o.work||'Заявка')+'</div><div class="orderMeta"><span>'+esc(o.client||'Клиент')+'</span><span>'+esc(o.address||'')+'</span><span>'+(o.scheduled_date?esc(o.scheduled_date)+' '+esc(o.scheduled_time||''):'Без даты')+'</span></div></div><div style="text-align:right"><span class="status '+statusClass(o.status)+'">'+esc(o.status||'В работе')+'</span><div class="amount" style="margin-top:9px">'+money(o.amount)+'</div></div></div></article>'}).join('')}
function bindOrderCards(){var cards=document.querySelectorAll('.orderCard');for(var i=0;i<cards.length;i++)cards[i].onclick=function(){openOrder(this.dataset.id)}}
function orders(){content('<div class="pageHead"><div><h1>Заявки</h1><p>'+state.orders.length+' заявок в базе</p></div><button id="newOrder" class="primary">+ Новая</button></div><div class="toolbar" style="margin-bottom:14px"><button class="chip" data-filter="all">Все</button><button class="chip" data-filter="В работе">В работе</button><button class="chip" data-filter="Выполнена">Выполнены</button><button class="chip" data-filter="Отменена">Отменены</button></div><div id="orderList" class="list">'+orderCards(state.orders)+'</div>');el('newOrder').onclick=openOrderForm;var fs=document.querySelectorAll('[data-filter]');for(var i=0;i<fs.length;i++)fs[i].onclick=function(){var f=this.dataset.filter,a=f==='all'?state.orders:state.orders.filter(function(o){return o.status===f});el('orderList').innerHTML=orderCards(a);bindOrderCards()};bindOrderCards()}
function openOrder(id){var o=state.orders.find(function(x){return String(x.id)===String(id)});if(!o)return;modal('<h2>'+esc(o.work||'Заявка')+'</h2><div class="notice">'+esc(o.client||'Клиент')+(o.phone?' · '+esc(o.phone):'')+'</div><form id="editOrder" class="form" style="margin-top:16px"><label>Статус</label><select name="status"><option'+(o.status==='В работе'?' selected':'')+'>В работе</option><option'+(o.status==='Выполнена'?' selected':'')+'>Выполнена</option><option'+(o.status==='Отменена'?' selected':'')+'>Отменена</option></select><label>Мастер</label><select name="master_vk_id"><option value="">Не назначен</option>'+state.masters.map(function(m){var idm=m.external_id||m.vk_user_id||m.id;return '<option value="'+esc(idm)+'"'+(String(o.master_vk_id||'')===String(idm)?' selected':'')+'>'+esc(m.full_name||'Мастер')+'</option>'}).join('')+'</select><div class="two"><div><label>Дата</label><input name="scheduled_date" type="date" value="'+esc(o.scheduled_date||'')+'"></div><div><label>Время</label><input name="scheduled_time" type="time" value="'+esc((o.scheduled_time||'').slice(0,5))+'"></div></div><label>Комментарий</label><textarea name="comment">'+esc(o.comment||'')+'</textarea><button class="primary wide" type="submit">Сохранить</button><p id="editMsg" class="error"></p></form>');el('editOrder').onsubmit=function(e){e.preventDefault();var f=e.currentTarget,m=el('editMsg'),p=Object.fromEntries(new FormData(f));m.textContent='Сохраняем…';api('updateOrder',Object.assign({id:o.id},p)).then(function(d){var k=state.orders.findIndex(function(x){return String(x.id)===String(o.id)});if(k>=0)state.orders[k]=d.order;closeModal();show('orders')}).catch(function(err){m.textContent=err.message})}}
function openOrderForm(){modal('<h2>Новая заявка</h2><form id="orderForm" class="form"><label>Клиент</label><input name="client" placeholder="Имя клиента" required><label>Телефон</label><input name="phone" type="tel" placeholder="+7 999 000-00-00"><label>Адрес</label><input name="address" placeholder="Адрес" required><label>Работа</label><input name="work" placeholder="Что нужно сделать" required><div class="two"><div><label>Дата выполнения</label><input name="scheduled_date" type="date"></div><div><label>Время</label><input name="scheduled_time" type="time"></div></div><label>Мастер</label><select name="master_vk_id"><option value="">Назначить позже</option>'+state.masters.map(function(m){return '<option value="'+esc(m.external_id||m.vk_user_id||m.id)+'">'+esc(m.full_name||'Мастер')+'</option>'}).join('')+'</select><label>Стоимость</label><input name="amount" type="number" min="0" step="1" placeholder="0"><label>Комментарий</label><textarea name="comment" placeholder="Дополнительная информация"></textarea><button class="primary wide" type="submit">Создать заявку</button><p id="orderMsg" class="error"></p></form>');el('orderForm').onsubmit=function(e){e.preventDefault();var f=e.currentTarget,m=el('orderMsg'),p=Object.fromEntries(new FormData(f));p.amount=Number(p.amount||0);m.textContent='Создаём…';api('createOrder',p).then(function(d){state.orders.unshift(d.order);closeModal();show('orders')}).catch(function(err){m.textContent=err.message})}}
function team(){var isOwner=state.user&&state.user.role==='owner';content('<div class="pageHead"><div><h1>Команда</h1><p>'+state.users.length+' сотрудников</p></div>'+(isOwner?'<button id="newEmployee" class="primary">+ Сотрудник</button>':'')+'</div><div class="list">'+(state.users.length?state.users.map(function(u){return '<article class="employeeCard"><div class="row"><div><div class="orderTitle">'+esc(u.full_name||'Сотрудник')+'</div><div class="orderMeta"><span>'+esc(u.phone||'Телефон не указан')+'</span><span>'+esc(u.city||'')+'</span><span>'+esc(u.specialization||'')+'</span></div></div><div class="employeeRole">'+esc(role(u.role))+'</div></div></article>'}).join(''):'<div class="empty">Сотрудников пока нет</div>')+'</div>');if(isOwner)el('newEmployee').onclick=openEmployeeForm}
function openEmployeeForm(){modal('<h2>Новый сотрудник</h2><form id="employeeForm" class="form"><label>Имя</label><input name="full_name" placeholder="Имя сотрудника" required><label>Телефон</label><input name="phone" type="tel" placeholder="+7 999 000-00-00" required><label>Роль</label><select name="role"><option value="master">Мастер</option><option value="dispatcher">Диспетчер</option><option value="manager">Руководитель</option></select><label>Город</label><input name="city" value="Москва"><label>Специализация</label><input name="specialization" placeholder="Карнизы, шторы, мелкий ремонт"><div class="two"><div><label>Начало дня</label><input name="work_start" type="time" value="09:00"></div><div><label>Конец дня</label><input name="work_end" type="time" value="18:00"></div></div><button class="primary wide" type="submit">Добавить сотрудника</button><p id="employeeMsg" class="error"></p></form>');el('employeeForm').onsubmit=function(e){e.preventDefault();var f=e.currentTarget,m=el('employeeMsg'),p=Object.fromEntries(new FormData(f));m.textContent='Добавляем…';api('addEmployee',p).then(function(d){state.users.push(d.user);if(d.master)state.masters.push(d.master);closeModal();show('team')}).catch(function(err){m.textContent=err.message})}}
function dispatch(){var arr=state.orders.filter(function(o){return o.scheduled_date}).sort(function(a,b){return String(a.scheduled_date+(a.scheduled_time||'')).localeCompare(String(b.scheduled_date+(b.scheduled_time||'')))});content('<div class="pageHead"><div><h1>График</h1><p>Запланированные выезды мастеров</p></div></div><div class="list">'+(arr.length?arr.map(function(o){return '<article class="scheduleCard"><div class="row"><div><div class="orderTitle">'+esc(o.scheduled_date)+' '+esc((o.scheduled_time||'').slice(0,5))+'</div><div class="orderMeta"><span>'+esc(o.work||'Заявка')+'</span><span>'+esc(o.address||'')+'</span></div></div><div style="text-align:right"><span class="status '+statusClass(o.status)+'">'+esc(o.status||'')+'</span><div class="muted" style="margin-top:8px;font-size:12px">'+esc(o.master_name||'Не назначен')+'</div></div></div></article>'}).join(''):'<div class="empty">Нет запланированных заявок</div>')+'</div>')}
function profile(){content('<div class="pageHead"><div><h1>Профиль</h1><p>Текущая рабочая учётная запись</p></div></div><section class="card"><div class="eyebrow">ПОЛЬЗОВАТЕЛЬ</div><h2 style="margin-bottom:5px">'+esc(state.user.full_name||'Пользователь')+'</h2><div class="muted">'+esc(role(state.user.role))+'</div><div style="height:18px"></div><button id="logout" class="secondary wide">Выйти</button></section><p class="desktopNote">Google Drive и полноценная авторизация будут подключены после стабилизации основного функционала.</p>');el('logout').onclick=function(){clear();state.user=null;showLogin('')}}
function modal(html){el('modalRoot').innerHTML='<div class="modalBack"><div class="modal"><button id="closeModal" class="close">×</button>'+html+'</div></div>';el('closeModal').onclick=closeModal;el('modalRoot').querySelector('.modalBack').onclick=function(e){if(e.target===this)closeModal()}}
function closeModal(){el('modalRoot').innerHTML=''}
function bind(){var bs=document.querySelectorAll('#nav button');for(var i=0;i<bs.length;i++)bs[i].onclick=function(){show(this.dataset.page)};el('profileBtn').onclick=function(){show('profile')}}
function start(){bind();if(session())load();else showLogin('')}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',start);else start();
})();
</script>
</body>
</html>
