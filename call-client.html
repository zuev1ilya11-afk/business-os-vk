<!doctype html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="referrer" content="no-referrer"><meta name="theme-color" content="#07111f"><title>Позвонить клиенту</title><style>html,body{margin:0;min-height:100%;background:#07111f;color:#f5f7fb;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{display:flex;align-items:center;justify-content:center;padding:24px;box-sizing:border-box}.card{width:min(100%,420px);background:#0e1b2b;border:1px solid rgba(255,255,255,.12);border-radius:22px;padding:24px;box-sizing:border-box;box-shadow:0 20px 60px rgba(0,0,0,.35)}h1{font-size:24px;margin:0 0 12px}.muted{color:#9fb0c5;line-height:1.45}.phone{font-size:28px;font-weight:800;margin:18px 0;overflow-wrap:anywhere}.btn{display:flex;align-items:center;justify-content:center;width:100%;min-height:52px;margin-top:12px;border:0;border-radius:14px;font-size:18px;font-weight:750;text-decoration:none;box-sizing:border-box;cursor:pointer}.primary{background:#1677e8;color:#fff}.secondary{background:#17283b;color:#f5f7fb;border:1px solid rgba(255,255,255,.12)}#msg{min-height:20px;margin:12px 0 0;font-size:14px}</style></head><body><main class="card"><h1>Позвонить клиенту</h1><p class="muted">Нажмите кнопку ниже — звонок откроется через приложение «Телефон».</p><div id="phone" class="phone">—</div><a id="call" class="btn primary" href="#">Позвонить</a><button id="copy" class="btn secondary" type="button">Скопировать номер</button><p id="msg" class="muted"></p></main><script>(()=>{const raw=new URLSearchParams(location.search).get('phone')||'';let phone=String(raw).trim().replace(/[^\d+]/g,'');if(/^8\d{10}$/.test(phone))phone='+7'+phone.slice(1);else if(/^\d{10}$/.test(phone))phone='+7'+phone;const phoneEl=document.getElementById('phone'),call=document.getElementById('call'),copy=document.getElementById('copy'),msg=document.getElementById('msg');if(!phone){phoneEl.textContent='Номер не указан';call.style.display='none';copy.style.display='none';return}phoneEl.textContent=phone;call.href='tel:'+phone;copy.onclick=async()=>{try{await navigator.clipboard.writeText(phone);msg.textContent='Номер скопирован'}catch(_){msg.textContent='Номер: '+phone}}})();</script></body></html>
